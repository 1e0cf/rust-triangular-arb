global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'market_data'
    static_configs:
      - targets: ['market_data:9090']

  - job_name: 'arb_engine'
    static_configs:
      - targets: ['arb_engine:9090']

  - job_name: 'executor'
    static_configs:
      - targets: ['executor:9090']