[workspace]
resolver = "2"
members = ["crates/*"]
package.edition = "2024"
package.rust-version = "1.87.0"

[workspace.dependencies]
anyhow = "1.0.98"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = "0.7.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
redis = "0.31.0"
once_cell = "1.21.3"
dotenvy = "0.15.7"
rust_decimal = "1.37.1"
metrics = "0.24.2"
futures-util = "0.3.31"