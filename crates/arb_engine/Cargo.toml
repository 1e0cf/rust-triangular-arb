[package]
name = "arb_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
shared_types = {path = "../shared_types"}
binance_connector = {path = "../binance_connector"}
utils = {path = "../utils"}

flume = "0.11.1"
dashmap = "7.0.0-rc2"
anyhow = "1.0.98"
ahash = "0.8.12"
dotenvy = "0.15.7"
ringbuf = "0.4.8"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = "0.7.15"
redis = {version = "0.31.0", features = ["tokio-comp", "streams", "connection-manager"]}
serde = { version = "1.0.219", features = ["derive"] }
binance_spot_connector_rust = { version = "1.3.0", features = ["enable-hyper", "enable-tokio-tungstenite"]}
serde_json = "1.0.140"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
petgraph = "0.8.1"
once_cell = "1.21.3"
rust_decimal = "1.37.1"
rust_decimal_macros = "1.37.1"